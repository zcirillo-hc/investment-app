<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Plan v2 6.13. `viewport-fit=cover` is load bearing: without it every env(safe-area-inset-*)
      value resolves to zero on an iPhone and none of the safe area padding below it does
      anything at all.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Spare Change</title>

    <!-- Plan v2 6.2. The PWA shell. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Must equal the light theme header colour from the palette (--c-ground), not a new colour. -->
    <meta name="theme-color" content="#f0f8f2" />
    <!-- iOS reads these two and not the manifest for the Home Screen icon and for standalone. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Spare Change" />
    <!--
      Plan v2 6.13. `default` draws dark status bar text over the app's own light background.
      `src/lib/theme.ts` switches this to `black-translucent` in dark mode, which draws light
      text and lets the app's dark background show through underneath. That only reads
      correctly once the safe area padding is in place, which is why the two ship together.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
